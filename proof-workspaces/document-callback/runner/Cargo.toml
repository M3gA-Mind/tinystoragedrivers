[package]
name = "document-callback-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
serde_json.workspace = true
tinybus = { workspace = true, features = ["modules"] }
tinystoragedrivers-bus = { path = "../../../crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "../../../crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-api = { path = "../../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../../crates/tinystoragedrivers-types" }
tinystoragedrivers-testkit = { path = "../../../crates/tinystoragedrivers-testkit" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
