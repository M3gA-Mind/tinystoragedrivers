[package]
name = "document-callback-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
tinystoragedrivers-client = { path = "../../../crates/tinystoragedrivers-client" }
tinystoragedrivers-schema = { path = "../../../crates/tinystoragedrivers-schema" }
tinystoragedrivers-secrets = { path = "../../../crates/tinystoragedrivers-secrets" }
serde_json.workspace = true
tinybus = { workspace = true, features = ["modules"] }
tinystoragedrivers-bus = { path = "../../../crates/tinystoragedrivers-bus" }
tinystoragedrivers-tinybus = { path = "../../../crates/tinystoragedrivers-tinybus" }
tinystoragedrivers-core = { path = "../../../crates/tinystoragedrivers-core" }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
