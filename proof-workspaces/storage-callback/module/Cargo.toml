[package]
name = "storage-callback-module-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tinybus.workspace = true
tinybus-module = { git = "https://github.com/senamakel/tinybus", rev = "24ec2ccafcc98fab35fa10ffcbcefa87eb32e3e8" }
tinystoragedrivers-api.workspace = true
tinystoragedrivers-types.workspace = true
tinystoragedrivers-busproxy = { path = "../../../crates/tinystoragedrivers-busproxy" }
tokio = { version = "1", features = ["sync"] }
