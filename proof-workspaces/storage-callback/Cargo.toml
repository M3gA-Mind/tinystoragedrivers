[workspace]
members = ["module", "runner"]
resolver = "3"

[workspace.dependencies]
tinybus = { git = "https://github.com/senamakel/tinybus", rev = "c7560289fd6f58b57622234f6d72ff9545cb38c9", default-features = false }
serde_json = "1"
tinystoragedrivers-api = { path = "../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../crates/tinystoragedrivers-types" }

[profile.dev]
debug = false
