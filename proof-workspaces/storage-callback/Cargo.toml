[workspace]
members = ["module", "runner"]
resolver = "3"

[workspace.dependencies]
tinybus = { git = "https://github.com/senamakel/tinybus", rev = "24ec2ccafcc98fab35fa10ffcbcefa87eb32e3e8", default-features = false }
serde_json = "1"
tinystoragedrivers-api = { path = "../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../crates/tinystoragedrivers-types" }

[profile.dev]
debug = false
