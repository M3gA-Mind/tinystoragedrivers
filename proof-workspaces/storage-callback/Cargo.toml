[workspace]
members = ["module", "runner"]
resolver = "3"

[workspace.dependencies]
tinybus = { git = "https://github.com/senamakel/tinybus", rev = "1d0aa34104c84f6817f398b0abe164df6c5e7b82", default-features = false }
serde_json = "1"
tinystoragedrivers-api = { path = "../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../crates/tinystoragedrivers-types" }

[profile.dev]
debug = false
