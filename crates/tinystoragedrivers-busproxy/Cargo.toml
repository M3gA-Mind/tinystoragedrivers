[package]
name = "tinystoragedrivers-busproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The real TinyBus transport for the storage bus: a module-side StorageTransport over bus proxies, and the host-side registration of the Storage objects."
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tinybus = { workspace = true, features = ["modules"] }
tinystoragedrivers-bus.workspace = true
tinystoragedrivers-api.workspace = true
tinystoragedrivers-types.workspace = true
tokio = { workspace = true, features = ["sync", "io-util", "rt", "time"] }
zeroize.workspace = true

[dev-dependencies]
tinystoragedrivers-testkit = { path = "../tinystoragedrivers-testkit" }
futures-util = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }

[lints]
workspace = true
