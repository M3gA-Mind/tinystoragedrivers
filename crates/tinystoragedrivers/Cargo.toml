[package]
name = "tinystoragedrivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable storage for OpenHuman: one set of ports, feature-gated SQLite, MongoDB, file and memory drivers selected by URL."
readme = "../../README.md"
keywords = ["storage", "database", "driver", "sqlite", "mongodb"]
categories = ["database"]
publish = false

[dependencies]
tinystoragedrivers-types = { workspace = true }
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-connect = { workspace = true, optional = true }
tinystoragedrivers-document = { workspace = true, default-features = false, features = ["memory"] }
tinystoragedrivers-kv = { workspace = true, default-features = false, features = ["memory"] }
tinystoragedrivers-blob = { workspace = true, default-features = false, features = ["memory"] }
tinystoragedrivers-queue = { workspace = true, default-features = false, features = ["memory", "document"] }
tinystoragedrivers-secrets = { workspace = true, default-features = false, features = ["memory"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tinystoragedrivers-testkit = { workspace = true }
tinystoragedrivers-document = { workspace = true, features = ["memory"] }

[features]
default = []
file = ["dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/file", "tinystoragedrivers-document/file", "tinystoragedrivers-kv/file", "tinystoragedrivers-blob/fs"]
sqlite = ["dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/sqlite", "tinystoragedrivers-document/sqlite", "tinystoragedrivers-kv/sqlite", "tinystoragedrivers-blob/sqlite"]
mongodb = ["dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/mongodb", "tinystoragedrivers-document/mongodb", "tinystoragedrivers-kv/mongodb", "tinystoragedrivers-blob/mongodb"]
s3 = ["dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/s3", "tinystoragedrivers-blob/s3"]
rabbitmq = ["tinystoragedrivers-queue/rabbitmq"]
keyring = ["tinystoragedrivers-secrets/keyring"]
kms-aws = ["tinystoragedrivers-secrets/kms-aws"]
kms-gcp = ["tinystoragedrivers-secrets/kms-gcp"]

[lints]
workspace = true
