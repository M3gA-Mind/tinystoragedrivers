[package]
name = "tinystoragedrivers-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory storage and conformance tools for tinystoragedrivers consumers."

[dependencies]
tinystoragedrivers-types = { workspace = true }
tinystoragedrivers-api = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tinystoragedrivers-document = { workspace = true, default-features = false, features = ["memory", "sqlite"] }
tempfile = { workspace = true }
tinystoragedrivers-connect = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
