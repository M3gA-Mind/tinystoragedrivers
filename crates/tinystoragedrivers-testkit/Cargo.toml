[package]
name = "tinystoragedrivers-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory storage and conformance tools for tinystoragedrivers consumers."

[dependencies]
tinystoragedrivers-types = { workspace = true }
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-document = { workspace = true, features = ["memory", "sqlite"] }
tinystoragedrivers-kv = { workspace = true, features = ["memory"] }
tinystoragedrivers-blob = { workspace = true, features = ["memory"] }
tinystoragedrivers-queue = { workspace = true, features = ["memory"] }
tinystoragedrivers-secrets = { workspace = true, features = ["memory"] }
async-trait = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
bytes = { workspace = true }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tempfile = { workspace = true }
tinystoragedrivers-connect = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
