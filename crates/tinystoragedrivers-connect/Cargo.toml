[package]
name = "tinystoragedrivers-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared database and transport connection handles for storage engines"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite", "dep:tokio", "dep:zstd", "dep:serde_json"]
mongodb = ["dep:mongodb"]
s3 = ["dep:object_store", "dep:url"]
amqp = ["dep:lapin"]
file = ["dep:tokio"]

[dependencies]
tinystoragedrivers-types = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
zstd = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
mongodb = { version = "3.6", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"], optional = true }
object_store = { version = "0.14.2", default-features = false, features = ["aws"], optional = true }
url = { version = "2", optional = true }
lapin = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
